<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<title>Kioku — Kana &amp; Kanji SRS</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="hanko" lang="ja">記</span><span>Kioku</span></div>
    <div class="streak" id="streak" title="Days in a row"></div>
  </header>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="on"><span class="ti" lang="ja">学</span><span>Study</span></button>
    <button data-tab="browse"><span class="ti" lang="ja">覧</span><span>Browse</span></button>
    <button data-tab="create"><span class="ti" lang="ja">作</span><span>Create</span></button>
    <button data-tab="settings"><span class="ti" lang="ja">設</span><span>Settings</span></button>
  </nav>
</div>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"><div class="sheet-inner" id="sheetInner"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="data/kana.js"></script>
<script src="data/kanji.js"></script>
<script src="data/emoji.js"></script>
<script src="js/srs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
